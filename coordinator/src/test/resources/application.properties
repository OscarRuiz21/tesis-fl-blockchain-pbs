# Configuración de pruebas: sin Fabric real y con rutas temporales.

fl.adapter.blockchain=memory

# Rutas de relleno: los tests que usan ASGateway lo mockean. Un
# @SpringBootTest sí instanciaría asRestClient y fallaría si estos archivos
# no existen, así que debe crearlos o mockear el bean.
fl.auth-server-url=https://localhost:18443
fl.coordinator-cert-path=${java.io.tmpdir}/coord-cert.pem
fl.coordinator-key-path=${java.io.tmpdir}/coord-key.pem
fl.coordinator-ca-path=${java.io.tmpdir}/coord-ca.pem

fl.client-url-template=http://localhost:18080/client-%d

fl.polling-interval-ms=50
fl.client-ready-timeout-ms=2000
fl.global-timeout-ms=10000

fl.fabric.channel=test-channel
fl.fabric.chaincode=test-cc
fl.fabric.msp-id=Org2MSP
fl.fabric.peer-endpoint=localhost:9051
fl.fabric.peer-override-authority=peer0.org2.fl.network
fl.fabric.crypto-path=/tmp/fabric

fl.python.executable=/usr/bin/python3
fl.python.eval-script=/tmp/eval.py

fl.results.output-dir=${java.io.tmpdir}/coordinator-test-results
