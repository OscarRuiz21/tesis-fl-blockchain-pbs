# Propiedades mínimas para los @WebMvcTest del controller. No desactivar
# web-application-type: @WebMvcTest necesita la capa MVC para MockMvc.
fl.anonymity-mode=pbs
fl.auth-server-url=https://localhost:8443
fl.polling-interval-ms=10
fl.polling-timeout-ms=1000
fl.metrics-output-dir=/tmp/fl-client-test
fl.fabric.channel=test-channel
fl.fabric.chaincode=test-chaincode
fl.fabric.msp-id=Org2MSP
fl.fabric.peer-endpoint=localhost:7051
fl.fabric.peer-override-authority=peer0.org2.fl.network
fl.fabric.crypto-path=/tmp/fabric
fl.fabric.user=User1
fl.python.executable=/usr/bin/python3
fl.python.script-path=/tmp/python/train.py
fl.python.timeout-minutes=1
